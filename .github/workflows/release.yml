# Release — публикация на PyPI через Trusted Publisher (OIDC, без API-токена в секретах).
#
# Разовая настройка на pypi.org (владелец аккаунта):
#   pypi.org → проект yandex-audience-cli → Publishing → Add GitHub Trusted Publisher:
#     owner: axisrow · repository: yandex-audience-cli · workflow: release.yml
#     environment: release
#
# Релиз: bump версии в pyproject.toml + yac/cli.py → git tag vX.Y.Z → git push --tags.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тег соответствует версии пакета
        run: |
          PKG=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "тег v$TAG не совпадает с версией пакета $PKG" >&2
            exit 1
          fi
      - name: Собрать sdist и wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # OIDC для Trusted Publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
